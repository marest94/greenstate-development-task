name: CI
on:
  push:
    branches: [main, 'feat/**', 'chore/**']
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Calendar dates in two process timezones
        run: |
          TZ=Europe/Belgrade npm test -w apps/api -- src/common/time/dates.test.ts src/availability/availability.test.ts
          TZ=America/New_York npm test -w apps/api -- src/common/time/dates.test.ts src/availability/availability.test.ts
      - run: npm run build
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-postgres-only
          POSTGRES_DB: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Bootstrap disposable database roles
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < infra/db/roles.sql
      - run: npm run test:integration
      - name: Verify the complete local stack and proxy log redaction
        env:
          COMPOSE_PROJECT_NAME: greenstate-ci
          DATABASE_PORT: 54330
          WEB_PORT: 18080
          APP_ORIGIN: http://localhost:18080
          STACK_BASE_URL: http://localhost:18080
        run: |
          docker compose up --build -d --wait
          npm run test:stack
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium
      - name: Verify portal and account journeys in desktop and narrow browsers
        env:
          STACK_BASE_URL: http://localhost:18080
        run: npm run test:browser
      - name: Retain browser failure report and traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-failure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

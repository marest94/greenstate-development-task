name: greenstate
services:
  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-postgres-only
      POSTGRES_DB: greenstate
    ports:
      - "127.0.0.1:${DATABASE_PORT:-54329}:5432"
    volumes:
      - database:/var/lib/postgresql
      - ./infra/db/roles.sql:/docker-entrypoint-initdb.d/001-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d greenstate"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    user: "1000:1000"
    working_dir: /app/apps/api
    command: ["sh", "-c", "npm run db:migrate && node dist/seed/main.js"]
    environment:
      MIGRATION_DATABASE_URL: postgresql://gs_owner:local-owner-only@db:5432/greenstate
      ADMIN_DATABASE_URL: postgresql://gs_admin:local-admin-only@db:5432/greenstate
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY_HOPS: 1
      AUTH_LOGIN_IP_LIMIT: ${AUTH_LOGIN_IP_LIMIT:-30}
      AUTH_LOGIN_ACCOUNT_LIMIT: ${AUTH_LOGIN_ACCOUNT_LIMIT:-10}
      AUTH_REGISTRATION_IP_LIMIT: ${AUTH_REGISTRATION_IP_LIMIT:-10}
      AUTH_PASSWORD_ACTOR_LIMIT: ${AUTH_PASSWORD_ACTOR_LIMIT:-10}
      AUTH_WINDOW_MS: ${AUTH_WINDOW_MS:-900000}
      AUTH_MAX_BUCKETS: ${AUTH_MAX_BUCKETS:-10000}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      DATABASE_URL: postgresql://gs_app:local-app-only@db:5432/greenstate
      ADMIN_DATABASE_URL: postgresql://gs_admin:local-admin-only@db:5432/greenstate
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/api/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  database:

server {
    listen 8080;
    server_tokens off;
    # API logging already records safe metadata; nginx defaults include sensitive query strings.
    access_log off;
    root /usr/share/nginx/html;
    index index.html;
    # Let the API enforce its 32 KiB JSON limit and return the shared error format.
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
